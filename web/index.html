<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>D_Trading — Diário Local + Nuvem</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/trader_pro.css"></head>
<body>
<div class="shell" id="shell">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><div class="brand-logo">↗</div><div><strong>D_Trading</strong><small>LOCAL + NUVEM</small></div><div id="avatarMini" class="avatar-small">DT</div></div>
    <nav id="sideNav">
      <button data-page="feed" class="navbtn"><span>◉</span> Feed</button>
      <button data-page="dashboard" class="navbtn active"><span>▦</span> Dashboard</button>
      <button data-page="operation" class="navbtn"><span>⊕</span> Nova Operação</button>
      <button data-page="calendar" class="navbtn"><span>▦</span> Calendário</button>
      <button data-page="plan" class="navbtn"><span>☷</span> Plano de Trade</button>
      <button data-page="books" class="navbtn"><span>▥</span> Livros</button>
      <button data-page="settings" class="navbtn"><span>⚙</span> Configurações</button>
      <button data-page="profile" class="navbtn"><span>♙</span> Perfil</button>
    </nav>
    <div class="side-bottom"><span class="side-dot"></span> Dados locais + nuvem opcional <small>v1.1 • offline-first</small></div>
  </aside>
  <div class="workspace"><header class="topbar"><button class="topburger iconbtn" id="mobileMenu" title="Menu">☰</button><div class="topcaption">GESTÃO • ANÁLISE • EVOLUÇÃO</div><div class="toolbar"><span id="syncBadge" class="sync-badge" title="Status de sincronização">◯ Local</span><span class="timerlabel" title="Cronômetro de estudo">◷ <b id="timerClock">00:00:00</b></span><button id="timerPlay" class="iconbtn" title="Iniciar/pausar cronômetro">▶</button><button id="timerReset" class="iconbtn" title="Zerar cronômetro (mantém histórico)">↶</button><button id="fullscreen" class="iconbtn" title="Tela cheia">⛶</button></div></header><main id="content" class="content"></main></div>
</div>
<div id="modalRoot"></div><div id="toastRoot" aria-live="polite"></div><input type="file" id="hiddenImage" accept="image/png,image/jpeg,image/webp,image/gif" hidden multiple><input type="file" id="hiddenBook" accept="application/pdf,.pdf" hidden><input type="file" id="hiddenBackup" accept="application/zip,.zip" hidden>
<script src="/app.js"></script><script src="/trader_pro.js"></script></body></html>
