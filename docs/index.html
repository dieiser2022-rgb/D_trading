<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b10">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="D_Trading">
  <meta name="description" content="Diário de trade sincronizado com o D_Trading no Windows.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://*.supabase.co; img-src 'self' blob: data:; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="./icon.svg">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./mobile_form.css">
  <title>D_Trading Mobile</title>
</head>
<body>
  <div id="app" class="app">
    <header class="topbar"><div class="brand"><span class="brandmark">↗</span><div><strong>D_Trading</strong><small>DIÁRIO DE TRADES · MOBILE</small></div></div><div class="top-right"><span id="net-status" class="net">Verificando</span><button id="sync-button" type="button" class="icon-button" title="Sincronizar" aria-label="Sincronizar">↻</button></div></header>
    <main id="screen" aria-live="polite"><section class="initial"><div class="spinner"></div><p>Preparando o diário...</p></section></main>
    <nav id="bottomnav" class="bottomnav" aria-label="Navegação principal" hidden>
      <button data-view="feed" type="button"><span class="navico">▦</span>Feed</button>
      <button data-view="dashboard" type="button"><span class="navico">◫</span>Dashboard</button>
      <button data-view="new" type="button"><span class="navico">⊕</span>Nova</button>
      <button data-view="settings" type="button"><span class="navico">⚙</span>Ajustes</button>
    </nav>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </div>
  <script defer src="./app.js"></script>
  <script defer src="./mobile_form.js"></script>
</body>
</html>
